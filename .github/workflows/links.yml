name: Check links

# Monthly and on demand: every web address written in the site's sources must still answer.
# A broken link fails the run, and GitHub emails the owner.
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # 403 and 429 are what APS, ASEE and ScienceDirect send to robots; a browser gets the page.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --scheme https --scheme http
            --accept "200..=299,403,429"
            _pages/ _projects/ _data/ _bibliography/papers.bib _config.yml
